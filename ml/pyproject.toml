[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customergroups"
version = "0.1.0"
description = "Customer group profitability ML package — features, training, leakage guard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
