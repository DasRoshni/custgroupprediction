name: CI

# One-page CI for the customer-group-predictor.
# Runs on every PR to main and on direct pushes to main.
# What it does:
#   1. Lint (ruff)
#   2. Unit tests (pytest, no model artifact needed)
#   3. Train a fresh model (so integration tests have something to load)
#   4. Integration tests (pytest, hits the FastAPI app)
#   5. dbt parse — validates dbt project compiles without needing BQ creds
#
# What it intentionally does NOT do (left to a follow-up):
#   - Docker build / push to Artifact Registry
#   - terraform plan / apply
#   - dbt build/test against a real BigQuery project (needs WIF setup)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r api/requirements-dev.txt
          pip install -e ml/
          pip install dbt-bigquery==1.8.2

      - name: Lint (ruff)
        run: ruff check api/src ml/src api/tests

      - name: Unit tests (pytest)
        working-directory: api
        run: pytest -v tests/unit

      - name: Train model artifact
        # Integration tests need ml/artifacts/model.joblib at import time.
        # `make train` curates the CSV → trains XGBoost → writes the artifact.
        # Takes ~30s on GH-hosted runners.
        run: make train

      - name: Integration tests (pytest)
        working-directory: api
        run: pytest -v -m integration

      - name: dbt parse
        # Compiles SQL + checks refs/sources resolve. Does not need BQ creds.
        # Real `dbt build` runs in the Vertex pipeline against BQ.
        env:
          PROJECT_ID: ci-placeholder
          DATASET: marketing
          BQ_LOCATION: US
        run: |
          dbt deps --project-dir ml_dbt
          dbt parse --project-dir ml_dbt --profiles-dir ml_dbt/profiles
